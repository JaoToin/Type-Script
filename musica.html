<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>

    <link rel="stylesheet" href="/css/index...css">
    <script src="/js/index...js" defer></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header style="text-align: center; margin-bottom: 20px;">
        <!-- Imagem do cabeçalho -->
        <img src="caminho-para-sua-imagem.jpg" alt="Logo ou Imagem" width="150">
        
        <!-- Links de navegação -->
        <nav style="margin-top: 10px;">
            <a href="#demonstracao">Demonstração prática</a> |
            <a href="#musica">Música</a> |
            <a href="#slide">Slide</a>
        </nav>
        
        <h1>Video</h1>
    </header>

    <!-- Corpo Principal (Flexbox usado para separar os dois asides lado a lado) -->
    <main style="display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; gap: 30px;">
        
        <!-- Aside 1: Formulário (Superior Esquerda) -->
    
        video width="640" height="360" controls>
            <source src="/video/Commit_da_Madrugada.mp4" type="video/mp4">
            Seu navegador não suporta o elemento de vídeo.

    </main>

    <!-- Rodapé -->
    <footer style="margin-top: 50px; text-align: center; padding: 20px; background-color: #f1f1f1;">
        <!-- Hashtags -->
        <p>#canva #SENAI #João #Vivian #Erick #Petrobras</p>
        
        <!-- Imagem/Link do Instagram -->
        <a href="https://instagram.com/@jao_guedesxs" target="_blank" rel="noopener noreferrer">
            <img src="/img/instagram.png" alt="Meu Instagram" width="40">
        </a>
    </footer>

</body>
</html>
